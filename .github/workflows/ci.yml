name: Build and verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:4173/ > /dev/null
      - name: Verify SPA fallback for every page
        run: |
          routes=(
            "/"
            "/abordagem"
            "/servicos"
            "/servicos/avaliacao-psicologica"
            "/servicos/intervencao-psicologica"
            "/servicos/neurodesenvolvimento"
            "/servicos/orientacao-parental"
            "/servicos/consultoria-escolar"
            "/servicos/formacao"
            "/artigos"
            "/recursos"
            "/loja"
            "/contacto"
            "/privacidade"
            "/cookies"
          )
          for route in "${routes[@]}"; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:4173$route")
            echo "$status $route"
            test "$status" = "200"
          done
